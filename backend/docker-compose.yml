services:
  db_biblioteca:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: library_password
    ports: ["5432:5432"]
    volumes: ["dados_biblioteca:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_user -d library_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    volumes: ["capas_biblioteca:/aplicacao/uploads"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://library_user:library_password@db_biblioteca:5432/library_db
      SESSION_SECRET: ${SESSION_SECRET:-segredo-local-altere-em-producao}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_SYNCHRONIZE: "true"
    ports: ["8080:8080"]
    depends_on:
      db_biblioteca: { condition: service_healthy }
volumes:
  dados_biblioteca:
  capas_biblioteca:
